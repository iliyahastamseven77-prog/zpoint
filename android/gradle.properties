# Zpoint Android client -- Gradle configuration
#
# NOTE: this file previously declared org.gradle.jvmargs TWICE and
# android.useAndroidX TWICE. In a .properties file the LAST occurrence wins,
# so `-XX:MaxMetaspaceSize=384m` was silently discarded by the later
# `org.gradle.jvmargs=-Xmx2g` line. Compose compilation is metaspace-hungry
# (and this module pulls in material-icons-extended), so that loss shows up
# as intermittent `OutOfMemoryError: Metaspace`. Declared once each now.

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=false

android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official
